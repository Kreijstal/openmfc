  workflow_dispatch:

jobs:
  drawing:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build standalone drawing tests with MSVC
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          midl /nologo /env x64 /tlb typelib_cache_fixture.tlb "%GITHUB_WORKSPACE%/tests/typelib_cache_fixture.idl"
          if errorlevel 1 exit /b 1
          rc /nologo /fo typelib_cache_fixture.res "%GITHUB_WORKSPACE%/tests/typelib_cache_fixture.rc"
          if errorlevel 1 exit /b 1
          rc /nologo /fo database_exception_fixture.res "%GITHUB_WORKSPACE%/tests/database_exception_fixture.rc"
          if errorlevel 1 exit /b 1
          link /nologo /dll /noentry /machine:x64 /out:database_exception_fixture.dll database_exception_fixture.res
          if errorlevel 1 exit /b 1
          cl /nologo /EHs /MT /std:c++17 /Gy /Gw /W0 /DUNICODE /D_UNICODE /DNOMINMAX /D_WIN32_WINNT=0x0601 /I"%GITHUB_WORKSPACE%/include" /I"%GITHUB_WORKSPACE%/phase4/src" /c "%GITHUB_WORKSPACE%/phase4/src/featurepack/controls/StaticData.cpp" /Fo:ControlStaticData.obj
          if errorlevel 1 exit /b 1
          > drawing.rsp (
            echo /nologo
            echo /EHs
            echo /MT
            echo /std:c++17
            echo /Gy
            echo /Gw
            echo /W0
            echo /DUNICODE
            echo /D_UNICODE
            echo /DNOMINMAX
            echo /D_WIN32_WINNT=0x0601
            echo /I"%GITHUB_WORKSPACE%/include"
            echo /I"%GITHUB_WORKSPACE%/phase4/src"
            echo /Fe:test_rendertarget_drawing.exe
            echo "%GITHUB_WORKSPACE%/tests/test_rendertarget_drawing.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/detail/GdicoreSupport.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/detail/CollectionStateSupport.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/core/collections/CObList.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/core/collections/CPtrArrayStorage.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/core/ole/COleConnPtContainer.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/core/ole/CConnectionPoint.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/core/ole/CEnumConnections.cpp"
            echo "%GITHUB_WORKSPACE%/phase4/src/core/ole/CEnumArrayInterfaces.cpp"
