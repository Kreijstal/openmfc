name: Thread messages, idle and exception ABI
on:
  push:
    paths:
      - 'include/openmfc/**'
      - 'phase4/src/core/app/**'
      - 'phase4/src/core/window/**'
      - 'phase4/src/core/frame/CFrameWnd*.cpp'
      - 'phase4/src/core/collections/**'
      - 'phase4/src/core/runtime/**'
      - 'phase4/src/core/controls/CToolTipCtrlLifetime.cpp'
      - 'phase4/src/detail/*Support.*'
      - 'tests/test_thread_message_routing.cpp'
      - 'tests/build_thread_message_routing.py'
      - 'tests/test_thread_idle.cpp'
      - 'tests/build_thread_idle.py'
      - 'tests/test_thread_message_filter.cpp'
      - 'tests/build_thread_message_filter.py'
      - '.github/workflows/thread_message_routing.yml'
  pull_request:
    paths:
      - 'include/openmfc/**'
      - 'phase4/src/core/app/**'
      - 'phase4/src/core/window/**'
      - 'phase4/src/core/frame/CFrameWnd*.cpp'
      - 'phase4/src/core/collections/**'
      - 'phase4/src/core/runtime/**'
      - 'phase4/src/core/controls/CToolTipCtrlLifetime.cpp'
      - 'phase4/src/detail/*Support.*'
      - 'tests/test_thread_message_routing.cpp'
      - 'tests/build_thread_message_routing.py'
      - 'tests/test_thread_idle.cpp'
      - 'tests/build_thread_idle.py'
      - 'tests/test_thread_message_filter.cpp'
      - 'tests/build_thread_message_filter.py'
      - '.github/workflows/thread_message_routing.yml'
  workflow_dispatch:
jobs:
  windows:
    name: Message routing (${{ matrix.flags == '' && 'default' || 'optimized' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flags: ['', '--optimize']
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify thread messages and window parent routing
        shell: cmd
        run: python tests/build_thread_message_routing.py --build "%RUNNER_TEMP%/message-routing" ${{ matrix.flags }}
      - name: Verify idle processing with production TLS, maps and window dispatch
        shell: cmd
        run: python tests/build_thread_idle.py --build "%RUNNER_TEMP%/thread-idle" ${{ matrix.flags }}
      - name: Verify dialog/menu filtering and frame virtual ABI
        shell: cmd
        run: python tests/build_thread_message_filter.py --build "%RUNNER_TEMP%/message-filter" ${{ matrix.flags }}
