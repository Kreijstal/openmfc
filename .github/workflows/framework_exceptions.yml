      - 'tests/test_internet_exceptions.cpp'
      - 'tests/test_exception_links.cpp'
      - 'tests/test_ansi_string_ownership.cpp'
      - 'tests/ansi_string_exports.h'
      - 'tests/wide_string_storage_exports.h'
      - 'tests/string_operations_exports.h'
      - 'tests/string_operations_tests.h'
      - 'tests/string_search_exports.h'
      - 'tests/string_search_tests.h'
      - 'tests/string_format_exports.h'
      - 'tests/string_format_tests.h'
      - 'tests/string_mutation_exports.h'
      - 'tests/string_mutation_tests.h'
      - 'tests/string_services_exports.h'
      - 'tests/string_services_tests.h'
      - 'phase4/src/core/collections/CStringA.cpp'
      - 'phase4/src/core/collections/CStringAStorage.cpp'
      - 'phase4/src/core/collections/CSimpleStringT.cpp'
      - 'phase4/src/core/collections/CStringVariant.cpp'
      - 'phase4/src/core/collections/CStringW.cpp'
      - 'phase4/src/core/runtime/CAfxStringMgr.cpp'
      - 'phase4/src/core/window/WindowActivation.cpp'
      - 'phase4/src/detail/WindowActivationSupport.h'
      - 'tests/build_framework_exceptions.py'
      - 'tests/build_string_imports.py'
      - 'tests/test_string_imports.cpp'
      - 'tests/string_dll_services.cpp'
      - 'tests/string_import_fixture.rc'
      - 'tools/gen_weak_stubs.py'
      - '.github/workflows/framework_exceptions.yml'
  pull_request:
    paths:
      - 'include/openmfc/**'
      - 'phase4/src/core/exceptions/**'
      - 'phase4/src/core/ole/OleExceptionTranslation.cpp'
      - 'phase4/src/detail/OleExceptionTranslationSupport.h'
      - 'phase4/src/core/runtime/AfxLoadString.cpp'
      - 'phase4/src/core/runtime/AfxFormatStrings.cpp'
      - 'phase4/src/core/collections/CStringBuffer.cpp'
      - 'phase4/src/core/collections/CStringResource.cpp'
      - 'phase4/src/core/runtime/AfxFindResourceHandle.cpp'
      - 'phase4/src/detail/CsimpleexceptionRttiSupport.*'
      - 'phase4/src/detail/StringResourceSupport.h'
      - 'phase4/src/detail/CStringOperations.h'
      - 'phase4/src/detail/CStringFormatSupport.h'
      - 'phase4/src/detail/CStringMutation.h'
      - 'phase4/src/detail/CStringServices.h'
      - 'tests/test_simple_exceptions_logic.cpp'
      - 'tests/test_ole_exception_rtti_logic.cpp'
      - 'tests/test_file_archive_exceptions.cpp'
      - 'tests/test_internet_exceptions.cpp'
      - 'tests/test_exception_links.cpp'
      - 'tests/test_ansi_string_ownership.cpp'
      - 'tests/ansi_string_exports.h'
      - 'tests/wide_string_storage_exports.h'
      - 'tests/string_operations_exports.h'
      - 'tests/string_operations_tests.h'
      - 'tests/string_search_exports.h'
      - 'tests/string_search_tests.h'
      - 'tests/string_format_exports.h'
      - 'tests/string_format_tests.h'
      - 'tests/string_mutation_exports.h'
      - 'tests/string_mutation_tests.h'
      - 'tests/string_services_exports.h'
      - 'tests/string_services_tests.h'
      - 'phase4/src/core/collections/CStringA.cpp'
      - 'phase4/src/core/collections/CStringAStorage.cpp'
      - 'phase4/src/core/collections/CSimpleStringT.cpp'
      - 'phase4/src/core/collections/CStringVariant.cpp'
      - 'phase4/src/core/collections/CStringW.cpp'
      - 'phase4/src/core/runtime/CAfxStringMgr.cpp'
      - 'phase4/src/core/window/WindowActivation.cpp'
      - 'phase4/src/detail/WindowActivationSupport.h'
      - 'tests/build_framework_exceptions.py'
      - 'tests/build_string_imports.py'
      - 'tests/test_string_imports.cpp'
      - 'tests/string_dll_services.cpp'
      - 'tests/string_import_fixture.rc'
      - 'tools/gen_weak_stubs.py'
      - '.github/workflows/framework_exceptions.yml'
  workflow_dispatch:
jobs:
  windows:
    name: Framework exception ABI (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ''
          - name: optimized
            flags: '--optimize'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify exception layouts, pointer catches, cached resources and ownership
        shell: cmd
        run: python tests/build_framework_exceptions.py --build "%RUNNER_TEMP%/framework-exceptions" ${{ matrix.flags }}
      - name: Link public and SDK string clients against production DLL exports
        shell: cmd
        run: python tests/build_string_imports.py --build "%RUNNER_TEMP%/string-imports" ${{ matrix.flags }}
