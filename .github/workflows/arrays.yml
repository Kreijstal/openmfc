name: Template array ABI
on:
  push:
    paths:
      - 'include/openmfc/**'
      - 'phase4/src/core/runtime/CObject*.cpp'
      - 'phase4/src/core/runtime/CArchive*.cpp'
      - 'phase4/src/core/runtime/RuntimeClass*.cpp'
      - 'phase4/src/core/runtime/CRuntimeClass.cpp'
      - 'phase4/src/core/runtime/AFX_MODULE_STATE.cpp'
      - 'phase4/src/core/runtime/ModuleStateAccessors.cpp'
      - 'phase4/src/detail/RegcoreSupport.*'
      - 'phase4/src/detail/FilecoreSupport.h'
      - 'phase4/src/core/runtime/NativeMemoryOperators.cpp'
      - 'phase4/src/core/controlbar/CControlBarInfo.cpp'
      - 'phase4/src/core/controlbar/CDockState.cpp'
      - 'phase4/src/core/app/CWinAppProfile.cpp'
      - 'phase4/src/detail/AppProfile.h'
      - 'phase4/src/detail/CControlBarInfoSupport.*'
      - 'phase4/src/detail/DockStateSupport.h'
      - 'phase4/src/detail/ClassicDockingSupport.h'
      - 'phase4/src/detail/FrameLifetimeSupport.h'
      - 'phase4/src/core/frame/CFrameWndDockState.cpp'
      - 'phase4/src/core/collections/CPtrArray*.cpp'
      - 'phase4/src/core/collections/CWordArray.cpp'
      - 'phase4/src/core/collections/CDWordArray.cpp'
      - 'phase4/src/core/collections/CUIntArray.cpp'
      - 'phase4/src/detail/PlainArrayStorage.h'
      - 'tests/*array*'
      - 'tests/*archive*'
      - 'tests/build_string_imports.py'
      - '.github/workflows/arrays.yml'
  pull_request:
    paths:
      - 'include/openmfc/**'
      - 'phase4/src/core/runtime/CObject*.cpp'
      - 'phase4/src/core/runtime/CArchive*.cpp'
      - 'phase4/src/core/runtime/RuntimeClass*.cpp'
      - 'phase4/src/core/runtime/CRuntimeClass.cpp'
      - 'phase4/src/core/runtime/AFX_MODULE_STATE.cpp'
      - 'phase4/src/core/runtime/ModuleStateAccessors.cpp'
      - 'phase4/src/detail/RegcoreSupport.*'
      - 'phase4/src/detail/FilecoreSupport.h'
      - 'phase4/src/core/runtime/NativeMemoryOperators.cpp'
      - 'phase4/src/core/controlbar/CControlBarInfo.cpp'
      - 'phase4/src/core/controlbar/CDockState.cpp'
      - 'phase4/src/core/app/CWinAppProfile.cpp'
      - 'phase4/src/detail/AppProfile.h'
      - 'phase4/src/detail/CControlBarInfoSupport.*'
      - 'phase4/src/detail/DockStateSupport.h'
      - 'phase4/src/detail/ClassicDockingSupport.h'
      - 'phase4/src/detail/FrameLifetimeSupport.h'
      - 'phase4/src/core/frame/CFrameWndDockState.cpp'
      - 'phase4/src/core/collections/CPtrArray*.cpp'
      - 'phase4/src/core/collections/CWordArray.cpp'
      - 'phase4/src/core/collections/CDWordArray.cpp'
      - 'phase4/src/core/collections/CUIntArray.cpp'
      - 'phase4/src/detail/PlainArrayStorage.h'
      - 'tests/*array*'
      - 'tests/*archive*'
      - 'tests/build_string_imports.py'
      - '.github/workflows/arrays.yml'
  workflow_dispatch:
jobs:
  windows:
    name: SDK array oracle (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ''
          - name: optimized
            flags: '--optimize'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compare production public arrays with installed SDK/native MFC arrays
        shell: cmd
        run: python tests/build_arrays.py --build "%RUNNER_TEMP%/arrays" ${{ matrix.flags }}
