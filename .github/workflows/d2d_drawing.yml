  workflow_dispatch:

jobs:
  drawing:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build standalone drawing tests with MSVC
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          midl /nologo /env x64 /tlb typelib_cache_fixture.tlb "%GITHUB_WORKSPACE%/tests/typelib_cache_fixture.idl"
          if errorlevel 1 exit /b 1
          rc /nologo /fo typelib_cache_fixture.res "%GITHUB_WORKSPACE%/tests/typelib_cache_fixture.rc"
          if errorlevel 1 exit /b 1
          cl /nologo /EHs /MT /std:c++17 /Gy /Gw /W0 /DUNICODE /D_UNICODE /DNOMINMAX /D_WIN32_WINNT=0x0601 /I"%GITHUB_WORKSPACE%/include" /I"%GITHUB_WORKSPACE%/phase4/src" /Fe:test_rendertarget_drawing.exe "%GITHUB_WORKSPACE%/tests/test_rendertarget_drawing.cpp" "%GITHUB_WORKSPACE%/phase4/src/detail/GdicoreSupport.cpp" "%GITHUB_WORKSPACE%/phase4/src/detail/CollectionStateSupport.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/collections/CObList.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/collections/CPtrArrayStorage.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/ole/COleConnPtContainer.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/ole/CConnectionPoint.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/ole/CEnumConnections.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/ole/CEnumArrayInterfaces.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/d2d/CD2DResource.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/window/CWndD2D.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/window/CWndAccessibility.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/window/CWndAccessibilityInterfaces.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/window/CWndAccessibilityProxy.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/runtime/D2DMessages.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/runtime/CCmdTargetVirtuals.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/runtime/CCmdTargetDispatch.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/runtime/CCmdTargetInvoke.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/runtime/CCmdTargetEvents.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/runtime/CCmdTargetTypeInfo.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/ole/CTypeLibCache.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/ole/COleDispatchImpl.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/ole/OleExceptionTranslation.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/exceptions/COleDispatchException.cpp" "%GITHUB_WORKSPACE%/phase4/src/detail/OleOleexceptionRttiSupport.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/runtime/InterfaceMaps.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/d2d/_AFX_D2D_STATE.cpp" "%GITHUB_WORKSPACE%/phase4/src/core/d2d/CDCRen